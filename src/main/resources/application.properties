# Import .env file
spring.config.import=optional:file:.env[.properties]

spring.application.name=LAB10
spring.datasource.url=${DB_URL:jdbc:sqlite:mydb.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration - SECRET MUST be overridden via environment variable in production!
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# Rate Limiting Configuration
rate.limit.requests-per-minute=${RATE_LIMIT_RPM:60}
rate.limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_RPM:10}

# Logging Configuration
logging.level.SECURITY=INFO
logging.level.com.example.LAB10.security=DEBUG
logging.level.org.springframework.security=INFO

# TEMPORARY: Show SQL parameter values (REMOVE for production - exposes sensitive data!)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# SSL/HTTPS Configuration
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=lab10

# HTTP port for redirect (handled by HttpToHttpsRedirectConfig)
server.http.port=8080
