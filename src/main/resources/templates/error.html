<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Error ' + ${status}">Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: #e53e3e;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 12px;
        }
        .error-message {
            color: #718096;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .error-details {
            background: #f7fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 14px;
            color: #4a5568;
        }
        .error-details dt {
            font-weight: 600;
            margin-top: 8px;
        }
        .error-details dd {
            margin-left: 0;
            color: #718096;
        }
        .back-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" th:text="${status}">500</div>
        <h1 class="error-title" th:text="${error}">Internal Server Error</h1>
        <p class="error-message" th:text="${message} ?: 'Something went wrong. Please try again later.'">
            An unexpected error occurred.
        </p>
        
        <dl class="error-details">
            <dt>Timestamp</dt>
            <dd th:text="${timestamp}">-</dd>
            <dt>Path</dt>
            <dd th:text="${path}">-</dd>
        </dl>
        
        <a href="/" class="back-btn">Go Back Home</a>
    </div>
</body>
</html>
